services:
  - type: web
    name: decision-intelligence-analyzer
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 300 --preload
    healthCheckPath: /api/datasets
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
